[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rpcnet"
version = "0.1.0"
description = "Low-latency RPC library with QUIC+TLS and SWIM gossip protocol"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
]
keywords = ["rpc", "quic", "async", "networking", "distributed-systems"]

[project.scripts]
rpcnet-gen = "rpcnet:rpcnet_gen_cli"

[project.urls]
Homepage = "https://github.com/jsam/rpcnet"
Documentation = "https://docs.rs/rpcnet"
Repository = "https://github.com/jsam/rpcnet"

[tool.maturin]
features = ["extension-module"]
module-name = "rpcnet._rpcnet"
bindings = "pyo3"
python-source = "python"
# data field is not supported in maturin for dev builds
