[package]
name = "streaming-example"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/server.rs"

[dependencies]
rpcnet = { path = "../../../" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
s2n-quic = "1.45"
async-stream = "0.3"
async-trait = "0.1"
rmp-serde = "1.3"
