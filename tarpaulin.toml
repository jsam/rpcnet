[tool.tarpaulin.coverage]
# Run coverage on lib tests and integration tests
run-types = ["Tests", "Doctests"]

# Enable all features including Python for comprehensive coverage
# Note: Python feature was previously excluded due to PyO3 linking issues on macOS
# but we'll try enabling it to measure Python module coverage
no-default-features = true
features = "codegen perf python"

# Include all source files
include-tests = false

# Exclude examples from coverage (they are for demonstration)
exclude = [
    "examples/*",
    "benches/*",
    "tests/*/mod.rs",
    "specs/*",
    "src/bin/*"
]

# Generate reports in multiple formats
out = ["Html", "Lcov", "Json"]

# Set minimum coverage threshold (50% realistic given Python/PyO3 FFI limitations)
# Python modules (278 lines) cannot be measured by tarpaulin due to FFI instrumentation issues
# Current coverage: 52.20% (1386/2655 lines)
# See COVERAGE_FINDINGS.md for detailed analysis and path to higher coverage
fail-under = 50

# Generate detailed HTML report
output-dir = "target/coverage"

# Follow symbolic links
follow-exec = true

# Count hits in different ways
count = true

# Skip clean between runs for performance
skip-clean = false

# Timeout for each test
timeout = 300

# Include line coverage
line = true

# Include branch coverage
branch = true

[tool.tarpaulin.report]
# Generate comprehensive reporting
output-dir = "coverage"